<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無線通訊原理 - 綜合練習系統</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-8 px-4">

    <div class="max-w-3xl mx-auto">
        <!-- 標題區 -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-600 mb-2">無線通訊原理 - 綜合練習系統</h1>
            <p class="text-slate-600">多檔案模組化架構：支援單元選擇、混合練習、選項隨機排序與進度暫存。</p>
        </header>

        <!-- 開始畫面 / 單元選擇 -->
        <div id="start-screen" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 space-y-6">
            <div class="text-center">
                <h2 class="text-xl font-bold text-slate-700 mb-2">請選擇您要練習的單元</h2>
                <p class="text-slate-500 text-sm">可單選或複選進行混合測驗</p>
            </div>

            <!-- 單元勾選清單 -->
            <div class="space-y-3 max-w-lg mx-auto">
                <label class="flex items-center gap-3 p-4 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition">
                    <input type="checkbox" name="unit-select" value="unit1" checked class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500">
                    <div>
                        <span class="font-bold text-slate-800 block">單元一：無線通訊基礎與頻譜、天線特性</span>
                        <span class="text-xs text-slate-500">基礎觀念與頻段天線</span>
                    </div>
                </label>
                <label class="flex items-center gap-3 p-4 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition">
                    <input type="checkbox" name="unit-select" value="unit2" checked class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500">
                    <div>
                        <span class="font-bold text-slate-800 block">單元二：通道特性、dB 運算與訊號衰減</span>
                        <span class="text-xs text-slate-500">穿透損失、RSSI、dBm 與衰減計算</span>
                    </div>
                </label>
                <label class="flex items-center gap-3 p-4 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition">
                    <input type="checkbox" name="unit-select" value="unit3" checked class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500">
                    <div>
                        <span class="font-bold text-slate-800 block">單元三：數位調變、編碼、OFDM、QAM 與 OFDMA</span>
                        <span class="text-xs text-slate-500">調變技術、編碼率與 OFDM 原理</span>
                    </div>
                </label>
                <label class="flex items-center gap-3 p-4 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition">
                    <input type="checkbox" name="unit-select" value="unit4" checked class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500">
                    <div>
                        <span class="font-bold text-slate-800 block">單元四：天線特性、空間分集、MIMO 與涵蓋範圍</span>
                        <span class="text-xs text-slate-500">天線增益、EIRP、空間串流、波束成形與覆蓋範圍</span>
                    </div>
                </label>
            </div>

            <!-- 操作按鈕 -->
            <div class="flex flex-col sm:flex-row justify-center gap-4 pt-4">
                <button onclick="startQuiz(false)" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-8 py-3 rounded-xl shadow-lg transition duration-200 cursor-pointer">
                    開始新測驗
                </button>
                <button id="resume-btn" onclick="resumeQuiz()" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-8 py-3 rounded-xl shadow-lg transition duration-200 cursor-pointer">
                    繼續上次未完成測驗
                </button>
            </div>
        </div>

        <!-- 測驗作答畫面 -->
        <div id="quiz-screen" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-white px-6 py-4 rounded-xl shadow-sm border border-slate-200 sticky top-4 z-10">
                <div class="flex items-center gap-4">
                    <button onclick="pauseQuiz()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-2 rounded-lg transition cursor-pointer">
                        暫存進度並返回
                    </button>
                    <span class="font-semibold text-slate-700">作答進度</span>
                </div>
                <span id="progress-indicator" class="text-indigo-600 font-bold">1 / 35</span>
            </div>

            <div id="questions-container" class="space-y-6">
                <!-- 動態插入題目 -->
            </div>

            <div class="text-center pt-4 pb-12">
                <button onclick="submitQuiz()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-10 py-4 rounded-xl shadow-lg transition duration-200 text-lg cursor-pointer">
                    交卷看成績
                </button>
            </div>
        </div>

        <!-- 結果結算畫面 -->
        <div id="result-screen" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center space-y-6">
            <h2 class="text-2xl font-bold text-slate-800">測驗結果</h2>
            <div class="flex justify-center items-center gap-8 my-6">
                <div class="bg-indigo-50 p-6 rounded-2xl border border-indigo-100 min-w-[140px]">
                    <p class="text-sm text-slate-500 mb-1">答對題數</p>
                    <p id="score-text" class="text-4xl font-black text-indigo-600">0 / 35</p>
                </div>
                <div class="bg-emerald-50 p-6 rounded-2xl border border-emerald-100 min-w-[140px]">
                    <p class="text-sm text-slate-500 mb-1">正確百分比</p>
                    <p id="percentage-text" class="text-4xl font-black text-emerald-600">0%</p>
                </div>
            </div>
            <div class="flex justify-center gap-4 flex-wrap">
                <button onclick="resetToStart()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl transition duration-200 cursor-pointer">
                    返回單元選擇
                </button>
                <button onclick="reviewAnswers()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-6 py-3 rounded-xl transition duration-200 cursor-pointer">
                    檢視詳細解析
                </button>
            </div>
        </div>

        <!-- 詳檢畫面 -->
        <div id="review-screen" class="hidden space-y-6 mt-8">
            <h3 class="text-xl font-bold text-slate-800 px-2">詳細解答與對錯檢視</h3>
            <div id="review-container" class="space-y-6">
                <!-- 動態插入解析 -->
            </div>
            <div class="text-center pb-12">
                <button onclick="resetToStart()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-8 py-3 rounded-xl shadow-lg transition duration-200 cursor-pointer">
                    返回首頁
                </button>
            </div>
        </div>
    </div>

    <!-- 載入外部單元題庫檔案 -->
    <script src="unit1.js"></script>
    <script src="unit2.js"></script>
    <script src="unit3.js"></script>
    <script src="unit4.js"></script>

    <script>
        // 集中管理所有單元資料（若某個單元檔案尚未建立或為空，預設給空陣列）
        const unitsData = {
            unit1: typeof unit1Data !== 'undefined' ? unit1Data : [],
            unit2: typeof unit2Data !== 'undefined' ? unit2Data : [],
            unit3: typeof unit3Data !== 'undefined' ? unit3Data : [],
            unit4: typeof unit4Data !== 'undefined' ? unit4Data : []
        };

        let currentQuizQuestions = [];
        let userAnswers = {};

        window.onload = function() {
            checkSavedProgress();
        };

        function checkSavedProgress() {
            const saved = localStorage.getItem('wireless_quiz_saved');
            const resumeBtn = document.getElementById('resume-btn');
            if (saved) {
                resumeBtn.classList.remove('hidden');
            } else {
                resumeBtn.classList.add('hidden');
            }
        }

        // 洗牌演算法
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function startQuiz(isResume = false) {
            if (isResume) {
                const savedData = JSON.parse(localStorage.getItem('wireless_quiz_saved'));
                if (savedData) {
                    currentQuizQuestions = savedData.questions;
                    userAnswers = savedData.answers;
                }
            } else {
                const selectedUnits = [];
                document.querySelectorAll('input[name="unit-select"]:checked').forEach(cb => {
                    selectedUnits.push(cb.value);
                });

                if (selectedUnits.length === 0) {
                    alert("請至少選擇一個單元！");
                    return;
                }

                let pool = [];
                selectedUnits.forEach(u => {
                    if (unitsData[u] && unitsData[u].length > 0) {
                        pool = pool.concat(unitsData[u]);
                    }
                });

                if (pool.length === 0) {
                    alert("您選擇的單元目前沒有題目，請檢查對應的 JS 檔案！");
                    return;
                }

                // 隨機打散整題池（題目順序隨機）
                currentQuizQuestions = JSON.parse(JSON.stringify(pool));
                shuffle(currentQuizQuestions);

                // **選項順序隨機洗牌**：確保每次選項 A、B、C、D 位置都不同
                currentQuizQuestions.forEach(item => {
                    let optionsWithIndex = item.options.map((opt, idx) => ({ 
                        text: opt, 
                        isCorrect: idx === item.answer 
                    }));
                    
                    shuffle(optionsWithIndex); // 打散選項
                    
                    item.options = optionsWithIndex.map(o => o.text);
                    item.answer = optionsWithIndex.findIndex(o => o.isCorrect); // 重新定位正確答案索引
                });

                userAnswers = {};
                localStorage.removeItem('wireless_quiz_saved');
            }

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('review-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');

            renderQuestions();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resumeQuiz() {
            startQuiz(true);
        }

        function pauseQuiz() {
            const state = {
                questions: currentQuizQuestions,
                answers: userAnswers
            };
            localStorage.setItem('wireless_quiz_saved', JSON.stringify(state));
            alert("進度已暫存！您可以隨時回來繼續。");
            resetToStart();
        }

        function resetToStart() {
            checkSavedProgress();
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('review-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';
            const total = currentQuizQuestions.length;

            currentQuizQuestions.forEach((item, qIndex) => {
                let optionsHtml = '';
                item.options.forEach((opt, oIndex) => {
                    const isChecked = userAnswers[qIndex] === oIndex ? 'checked' : '';
                    optionsHtml += `
                        <label class="flex items-start gap-3 p-3 rounded-lg border border-slate-200 hover:bg-slate-50 cursor-pointer transition">
                            <input type="radio" name="question-${qIndex}" value="${oIndex}" ${isChecked} onchange="recordAnswer(${qIndex}, ${oIndex})" class="mt-1 text-indigo-600 focus:ring-indigo-500">
                            <span class="text-slate-700 text-sm md:text-base">${String.fromCharCode(65 + oIndex)}. ${opt}</span>
                        </label>
                    `;
                });

                container.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
                        <h3 class="font-bold text-slate-800 text-base md:text-lg">第 ${qIndex + 1} 題：${item.q}</h3>
                        <div class="space-y-2">
                            ${optionsHtml}
                        </div>
                    </div>
                `;
            });
            const answeredCount = Object.keys(userAnswers).length;
            document.getElementById('progress-indicator').innerText = `已作答 ${answeredCount} / ${total}`;
        }

        function recordAnswer(qIndex, oIndex) {
            userAnswers[qIndex] = oIndex;
            const answeredCount = Object.keys(userAnswers).length;
            const total = currentQuizQuestions.length;
            document.getElementById('progress-indicator').innerText = `已作答 ${answeredCount} / ${total}`;
        }

        function submitQuiz() {
            const total = currentQuizQuestions.length;
            let correctCount = 0;
            currentQuizQuestions.forEach((item, qIndex) => {
                if (userAnswers[qIndex] === item.answer) {
                    correctCount++;
                }
            });

            const percentage = ((correctCount / total) * 100).toFixed(1);

            document.getElementById('score-text').innerText = `${correctCount} / ${total}`;
            document.getElementById('percentage-text').innerText = `${percentage}%`;

            localStorage.removeItem('wireless_quiz_saved');
            checkSavedProgress();

            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function reviewAnswers() {
            document.getElementById('result-screen').classList.add('hidden');
            const reviewContainer = document.getElementById('review-container');
            reviewContainer.innerHTML = '';

            currentQuizQuestions.forEach((item, qIndex) => {
                const userChoice = userAnswers[qIndex];
                const isCorrect = userChoice === item.answer;
                const statusBadge = isCorrect 
                    ? `<span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-1 rounded-full">答對</span>`
                    : `<span class="bg-rose-100 text-rose-800 text-xs font-semibold px-2.5 py-1 rounded-full">答錯</span>`;

                let optionsHtml = '';
                item.options.forEach((opt, oIndex) => {
                    let style = "border-slate-200 text-slate-700 bg-white";
                    if (oIndex === item.answer) {
                        style = "border-emerald-500 bg-emerald-50 text-emerald-900 font-medium";
                    } else if (oIndex === userChoice && !isCorrect) {
                        style = "border-rose-500 bg-rose-50 text-rose-900 line-through";
                    }

                    optionsHtml += `
                        <div class="p-2.5 rounded-lg border ${style} text-sm">
                            ${String.fromCharCode(65 + oIndex)}. ${opt}
                        </div>
                    `;
                });

                reviewContainer.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-slate-800 text-base">第 ${qIndex + 1} 題：${item.q}</h3>
                            ${statusBadge}
                        </div>
                        <div class="space-y-2">
                            ${optionsHtml}
                        </div>
                        <div class="bg-slate-50 p-4 rounded-xl text-sm text-slate-600 border border-slate-100 mt-2">
                            <span class="font-semibold text-slate-700">詳解：</span>${item.explanation}
                        </div>
                    </div>
                `;
            });

            document.getElementById('review-screen').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
